<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ゼミ日程 希望調査</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 画面上部に A〜E の切り替え、その下に選択中の人の3か月カレンダー、最後にLINE送信欄 */
:root {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --fg: #1c2b27;
  --muted: #64766f;
  --line: #d9e1de;
  --accent: #0e6b5c;
  --accent-fg: #ffffff;
  --accent-soft: #dcefe9;
  --off-bg: #eceff0;
  --line-green: #06a955;
  --font: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101816;
    --surface: #18231f;
    --fg: #e6efec;
    --muted: #93a8a1;
    --line: #2b3b36;
    --accent: #4fc2ab;
    --accent-fg: #0b1512;
    --accent-soft: #1d3a33;
    --off-bg: #202c28;
    --line-green: #2fcf7b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101816;
  --surface: #18231f;
  --fg: #e6efec;
  --muted: #93a8a1;
  --line: #2b3b36;
  --accent: #4fc2ab;
  --accent-fg: #0b1512;
  --accent-soft: #1d3a33;
  --off-bg: #202c28;
  --line-green: #2fcf7b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

h1 { font-size: 22px; line-height: 1.3; margin: 0; font-weight: 700; text-wrap: balance; }
.lead { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

.picker { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.picker button {
  font: inherit;
  font-weight: 700;
  font-size: 20px;
  min-height: 56px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  border-radius: 8px;
  cursor: pointer;
  padding: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
}
.picker button small { font-size: 11px; font-weight: 500; color: var(--muted); margin-top: 3px; }
.picker button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.picker button[aria-pressed="true"] small { color: var(--accent-fg); opacity: .85; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.summary h2 { margin: 0 0 8px; font-size: 16px; font-weight: 700; }
.summary h2 span { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.chips li { background: var(--accent-soft); color: var(--fg); border-radius: 6px; padding: 2px 10px; font-size: 14px; font-variant-numeric: tabular-nums; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin: 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.swatch.on { background: var(--accent); }
.swatch.off { background: var(--off-bg); border: 1px solid var(--line); }

.months { display: flex; flex-direction: column; gap: 16px; }
.month { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 10px 10px; }
.month h3 { margin: 0 0 8px 6px; font-size: 15px; font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.dow { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 2px; }
.cell {
  aspect-ratio: 1 / 1.05;
  border-radius: 6px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 14px; font-variant-numeric: tabular-nums; line-height: 1.15;
  min-width: 0;
}
.cell .tag { font-size: 10px; font-weight: 700; margin-top: 1px; }
.cell.blank { visibility: hidden; }
.cell.on { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
.cell.off { background: var(--off-bg); color: var(--muted); }

.send, .shot { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.send h2, .shot h2 { margin: 0; font-size: 16px; font-weight: 700; }
#shotOut { display: flex; flex-direction: column; gap: 8px; }
#shotImg { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; background: #ffffff; }
textarea#msg {
  width: 100%; min-height: 128px; resize: none; font: inherit; font-size: 14px;
  color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
}
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
  font: inherit; font-weight: 700; font-size: 15px; min-height: 48px; border-radius: 8px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--fg); cursor: pointer; text-decoration: none;
  display: flex; align-items: center; justify-content: center; text-align: center;
}
.btn.line { background: var(--line-green); border-color: var(--line-green); color: #ffffff; }
.note { margin: 0; font-size: 12px; color: var(--muted); }
#status { min-height: 1.4em; margin: 0; font-size: 13px; color: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  .cell, .picker button { transition: background-color .15s, color .15s; }
}
</style>

<div class="wrap">
  <header>
    <h1>ゼミ日程 希望調査</h1>
    <p class="lead">自分の文字を選ぶと、ゼミの日程がカレンダーで確認できます。</p>
  </header>

  <div class="picker" id="picker" role="group" aria-label="希望する日程を選択"></div>

  <section class="summary" aria-live="polite">
    <h2><span id="who"></span>のゼミあり <span id="count"></span></h2>
    <ul class="chips" id="chips"></ul>
  </section>

  <p class="legend">
    <span><i class="swatch on"></i>ゼミあり</span>
    <span><i class="swatch off"></i>ゼミなし（候補日のうち対象外）</span>
  </p>

  <div class="months" id="months"></div>

  <section class="shot">
    <h2>スクショ用の画像</h2>
    <p class="note">選んだ人のゼミ日程を、3か月分まとめた1枚の画像にします。</p>
    <button class="btn" id="shotBtn" type="button">1枚の画像にする</button>
    <div id="shotOut" hidden>
      <img id="shotImg" alt="選んだ人のゼミ日程をまとめた画像">
      <p class="note">画像を長押しして「写真に追加」を選ぶと、写真アプリに保存できます。保存した画像は、LINEのトークに添付して送れます。</p>
    </div>
  </section>

  <section class="send">
    <h2>この内容を送る</h2>
    <textarea id="msg" readonly aria-label="送信メッセージ"></textarea>
    <div class="actions">
      <a class="btn line" id="lineBtn" href="#" target="_blank" rel="noopener">LINEで送る</a>
      <button class="btn" id="copyBtn" type="button">コピーする</button>
    </div>
    <p id="status" aria-live="polite"></p>
    <p class="note">LINEが開かない場合は「コピーする」を押して、トーク画面に貼り付けてください。</p>
  </section>
</div>

<script>
(function () {
  var NAMES = ["A", "B", "C", "D", "E"];
  // 日付ごとのゼミありの人
  var DATA = {
    "2026-11-16": ["A", "C", "D"],
    "2026-11-23": ["B", "E"],
    "2026-11-30": ["A", "B", "C", "D", "E"],
    "2026-12-07": ["A", "C"],
    "2026-12-14": ["B", "D", "E"],
    "2026-12-21": ["A", "B", "C", "D", "E"],
    "2027-01-18": ["A", "D"],
    "2027-01-25": ["B", "C", "E"]
  };
  var MONTHS = [[2026, 10], [2026, 11], [2027, 0]];
  var DOW = ["日", "月", "火", "水", "木", "金", "土"];
  var current = "A";

  function key(y, m, d) {
    return y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  }
  function label(k) {
    var p = k.split("-").map(Number);
    var dow = new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay();
    return p[1] + "/" + p[2] + "（" + DOW[dow] + "）";
  }
  function datesFor(n) {
    return Object.keys(DATA).sort().filter(function (k) { return DATA[k].indexOf(n) !== -1; });
  }

  var picker = document.getElementById("picker");
  NAMES.forEach(function (n) {
    var b = document.createElement("button");
    b.type = "button";
    b.id = "pick-" + n;
    b.innerHTML = n + "<small>さん</small>";
    b.addEventListener("click", function () { select(n); });
    picker.appendChild(b);
  });

  function renderMonths() {
    var root = document.getElementById("months");
    root.innerHTML = "";
    MONTHS.forEach(function (ym) {
      var y = ym[0], m = ym[1];
      var box = document.createElement("section");
      box.className = "month";
      var h = document.createElement("h3");
      h.textContent = y + "年" + (m + 1) + "月";
      box.appendChild(h);
      var grid = document.createElement("div");
      grid.className = "grid";
      DOW.forEach(function (w) {
        var c = document.createElement("div");
        c.className = "dow";
        c.textContent = w;
        grid.appendChild(c);
      });
      var first = new Date(Date.UTC(y, m, 1)).getUTCDay();
      var days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
      for (var i = 0; i < first; i++) {
        var e = document.createElement("div");
        e.className = "cell blank";
        grid.appendChild(e);
      }
      for (var d = 1; d <= days; d++) {
        var k = key(y, m, d);
        var cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.date = k;
        cell.textContent = d;
        grid.appendChild(cell);
      }
      box.appendChild(grid);
      root.appendChild(box);
    });
  }

  function paint() {
    var cells = document.querySelectorAll(".cell[data-date]");
    cells.forEach(function (cell) {
      var k = cell.dataset.date;
      var old = cell.querySelector(".tag");
      if (old) old.remove();
      cell.classList.remove("on", "off");
      if (DATA[k]) {
        var has = DATA[k].indexOf(current) !== -1;
        cell.classList.add(has ? "on" : "off");
        var t = document.createElement("span");
        t.className = "tag";
        t.textContent = has ? "あり" : "なし";
        cell.appendChild(t);
      }
    });
  }

  function message() {
    var ds = datesFor(current).map(label);
    return "ゼミ日程の希望は「" + current + "さん」の日程です。\n\n" +
      "ゼミあり（" + ds.length + "日）\n" + ds.join("\n");
  }

  function select(n) {
    current = n;
    NAMES.forEach(function (x) {
      document.getElementById("pick-" + x).setAttribute("aria-pressed", x === n ? "true" : "false");
    });
    var ds = datesFor(n);
    document.getElementById("who").textContent = n + "さん";
    document.getElementById("count").textContent = "（" + ds.length + "日）";
    var chips = document.getElementById("chips");
    chips.innerHTML = "";
    ds.forEach(function (k) {
      var li = document.createElement("li");
      li.textContent = label(k);
      chips.appendChild(li);
    });
    paint();
    var text = message();
    document.getElementById("msg").value = text;
    document.getElementById("lineBtn").href = "https://line.me/R/msg/text/?" + encodeURIComponent(text);
    document.getElementById("status").textContent = "";
    refreshShot();
  }

  // ---- スクショ用の画像（canvasで描画）----
  var SHOT_FONT = '"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif';

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 描画して、必要だった高さを返す
  function drawShot(ctx, W, H) {
    var C = { bg: "#ffffff", card: "#f4f6f5", fg: "#1c2b27", muted: "#64766f", accent: "#0e6b5c", off: "#e3e8e6" };
    var pad = 48, cellW = (W - pad * 2) / 7, cellH = 84, y = pad;
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";

    ctx.font = "700 60px " + SHOT_FONT;
    ctx.fillStyle = C.fg;
    ctx.fillText("ゼミ日程　" + current + "さん", pad, y + 30);
    y += 84;

    var ds = datesFor(current).map(label);
    ctx.font = "700 36px " + SHOT_FONT;
    ctx.fillStyle = C.accent;
    ctx.fillText("ゼミあり　" + ds.length + "日", pad, y + 18);
    y += 56;

    ctx.font = "500 32px " + SHOT_FONT;
    ctx.fillStyle = C.fg;
    var lines = [], line = "";
    ds.forEach(function (d) {
      var test = line ? line + "　" + d : d;
      if (line && ctx.measureText(test).width > W - pad * 2) {
        lines.push(line);
        line = d;
      } else {
        line = test;
      }
    });
    if (line) lines.push(line);
    lines.forEach(function (l) {
      ctx.fillText(l, pad, y + 20);
      y += 48;
    });
    y += 20;

    MONTHS.forEach(function (ym) {
      var yr = ym[0], mo = ym[1];
      var first = new Date(Date.UTC(yr, mo, 1)).getUTCDay();
      var days = new Date(Date.UTC(yr, mo + 1, 0)).getUTCDate();
      var rows = Math.ceil((first + days) / 7);
      var cardTop = y;
      var cardH = 130 + rows * cellH + 20;
      ctx.fillStyle = C.card;
      roundRect(ctx, 24, cardTop, W - 48, cardH, 20);
      ctx.fill();

      ctx.textAlign = "left";
      ctx.font = "700 38px " + SHOT_FONT;
      ctx.fillStyle = C.fg;
      ctx.fillText(yr + "年" + (mo + 1) + "月", pad, cardTop + 52);

      ctx.textAlign = "center";
      ctx.font = "500 24px " + SHOT_FONT;
      ctx.fillStyle = C.muted;
      DOW.forEach(function (w, i) {
        ctx.fillText(w, pad + cellW * (i + 0.5), cardTop + 104);
      });

      var gridTop = cardTop + 130;
      for (var d = 1; d <= days; d++) {
        var idx = first + d - 1;
        var tx = pad + (idx % 7) * cellW;
        var ty = gridTop + Math.floor(idx / 7) * cellH;
        var k = key(yr, mo, d);
        var cx = tx + cellW / 2;
        if (DATA[k]) {
          var has = DATA[k].indexOf(current) !== -1;
          ctx.fillStyle = has ? C.accent : C.off;
          roundRect(ctx, tx + 4, ty + 4, cellW - 8, cellH - 8, 12);
          ctx.fill();
          ctx.fillStyle = has ? "#ffffff" : C.muted;
          ctx.font = "700 34px " + SHOT_FONT;
          ctx.fillText(String(d), cx, ty + cellH * 0.4);
          ctx.font = "700 22px " + SHOT_FONT;
          ctx.fillText(has ? "あり" : "なし", cx, ty + cellH * 0.74);
        } else {
          ctx.fillStyle = C.fg;
          ctx.font = "500 32px " + SHOT_FONT;
          ctx.fillText(String(d), cx, ty + cellH * 0.5);
        }
      }
      y = cardTop + cardH + 28;
    });

    ctx.textAlign = "left";
    ctx.font = "500 28px " + SHOT_FONT;
    ctx.fillStyle = C.muted;
    ctx.fillText("緑＝ゼミあり　グレー＝ゼミなし（候補日のうち対象外）", pad, y + 16);
    y += 32 + pad;
    return y;
  }

  function buildShot() {
    var W = 1080;
    var scratch = document.createElement("canvas");
    scratch.width = W;
    scratch.height = 6000;
    var h = drawShot(scratch.getContext("2d"), W, 6000);
    var c = document.createElement("canvas");
    c.width = W;
    c.height = Math.ceil(h);
    drawShot(c.getContext("2d"), W, c.height);
    return c.toDataURL("image/png");
  }

  function showShot() {
    var out = document.getElementById("shotOut");
    var img = document.getElementById("shotImg");
    function run() {
      try {
        img.src = buildShot();
        out.hidden = false;
      } catch (e) {
        document.getElementById("status").textContent = "画像を作れませんでした。画面のスクリーンショットを使ってください。";
      }
    }
    if (document.fonts && document.fonts.load) {
      Promise.all([
        document.fonts.load('700 36px "Zen Kaku Gothic New"', "ゼミ日程あり"),
        document.fonts.load('500 32px "Zen Kaku Gothic New"', "ゼミ日程あり")
      ]).then(run, run);
    } else {
      run();
    }
  }

  function refreshShot() {
    var out = document.getElementById("shotOut");
    if (out && !out.hidden) showShot();
  }

  document.getElementById("shotBtn").addEventListener("click", showShot);

  document.getElementById("copyBtn").addEventListener("click", function () {
    var ta = document.getElementById("msg");
    var status = document.getElementById("status");
    function fallback() {
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      status.textContent = "文字を選択しました。長押しして「コピー」を押してください。";
    }
    try {
      navigator.clipboard.writeText(ta.value).then(function () {
        status.textContent = "コピーしました。LINEのトーク画面に貼り付けてください。";
      }, fallback);
    } catch (e) {
      fallback();
    }
  });

  renderMonths();
  select(current);
})();
</script>

</body></html>
